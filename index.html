<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ultimate Tic-Tac-Toe</title>
    <style>
        :root {
            --primary: #6c5ce7;
            --secondary: #a29bfe;
            --bg: #1a1a2e;
            --card-bg: #16213e;
            --text: #ffffff;
            --x-color: #ff7675;
            --o-color: #55efc4;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }

        h1 { margin-bottom: 10px; font-weight: 300; letter-spacing: 2px; }

        /* Scoreboard */
        .scoreboard {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
            background: var(--card-bg);
            padding: 15px 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        .score-item { text-align: center; }
        .score-number { font-size: 1.5rem; font-weight: bold; display: block; }

        /* Game Info */
        .status {
            font-size: 1.2rem;
            margin-bottom: 20px;
            height: 30px;
            font-weight: 500;
        }

        /* The Grid */
        .board {
            display: grid;
            grid-template-columns: repeat(3, 100px);
            grid-template-rows: repeat(3, 100px);
            gap: 10px;
            background-color: #0f3460;
            padding: 10px;
            border-radius: 10px;
        }

        .cell {
            width: 100px;
            height: 100px;
            background-color: var(--card-bg);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            border-radius: 5px;
            user-select: none;
        }

        .cell:hover:not(.taken) {
            background-color: #1f4068;
            transform: scale(0.98);
        }

        .cell.taken { cursor: not-allowed; }
        .cell.x { color: var(--x-color); }
        .cell.o { color: var(--o-color); }

        .cell.winner {
            background-color: var(--primary);
            animation: pulse 1s infinite alternate;
        }

        /* Controls */
        .controls {
            margin-top: 30px;
            display: flex;
            gap: 15px;
        }

        button {
            padding: 10px 20px;
            font-size: 1rem;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background 0.3s;
            font-weight: bold;
        }

        .reset-btn { background-color: var(--primary); color: white; }
        .reset-btn:hover { background-color: var(--secondary); }

        .mode-btn { background-color: #444; color: white; }
        .mode-btn.active { background-color: #00b894; }

        @keyframes pulse {
            from { transform: scale(1); }
            to { transform: scale(1.05); box-shadow: 0 0 20px var(--primary); }
        }

        @media (max-width: 400px) {
            .board { grid-template-columns: repeat(3, 80px); grid-template-rows: repeat(3, 80px); }
            .cell { width: 80px; height: 80px; font-size: 2.5rem; }
        }
    </style>
</head>
<body>

    <h1>TIC TAC TOE</h1>

    <div class="scoreboard">
        <div class="score-item">Player X <span id="score-x" class="score-number">0</span></div>
        <div class="score-item">Draws <span id="score-draws" class="score-number">0</span></div>
        <div class="score-item">Player O (AI) <span id="score-o" class="score-number">0</span></div>
    </div>

    <div class="status" id="status">Player X's Turn</div>

    <div class="board" id="board">
        <div class="cell" data-index="0"></div>
        <div class="cell" data-index="1"></div>
        <div class="cell" data-index="2"></div>
        <div class="cell" data-index="3"></div>
        <div class="cell" data-index="4"></div>
        <div class="cell" data-index="5"></div>
        <div class="cell" data-index="6"></div>
        <div class="cell" data-index="7"></div>
        <div class="cell" data-index="8"></div>
    </div>

    <div class="controls">
        <button class="mode-btn active" id="pvp-btn">Player vs Player</button>
        <button class="mode-btn" id="pva-btn">vs AI</button>
        <button class="reset-btn" id="reset-btn">Restart Game</button>
    </div>

    <script>
        const boardElement = document.getElementById('board');
        const cells = document.querySelectorAll('.cell');
        const statusText = document.getElementById('status');
        const resetBtn = document.getElementById('reset-btn');
        const pvpBtn = document.getElementById('pvp-btn');
        const pvaBtn = document.getElementById('pva-btn');

        // Scores
        let scores = { x: 0, o: 0, draws: 0 };
        
        let currentPlayer = 'X';
        let gameState = ["", "", "", "", "", "", "", "", ""];
        let gameActive = true;
        let isAiMode = false;

        const winningConditions = [
            [0, 1, 2], [3, 4, 5], [6, 7, 8], // Rows
            [0, 3, 6], [1, 4, 7], [2, 5, 8], // Cols
            [0, 4, 8], [2, 4, 6]             // Diagonals
        ];

        // --- Logic ---

        function handleCellClick(e) {
            const clickedCell = e.target;
            const clickedIndex = parseInt(clickedCell.getAttribute('data-index'));

            if (gameState[clickedIndex] !== "" || !gameActive) return;

            makeMove(clickedCell, clickedIndex);
            
            if (gameActive && isAiMode && currentPlayer === 'O') {
                setTimeout(aiMove, 500); // Slight delay for realism
            }
        }

        function makeMove(cell, index) {
            gameState[index] = currentPlayer;
            cell.innerText = currentPlayer;
            cell.classList.add('taken', currentPlayer.toLowerCase());

            checkResult();
        }

        function aiMove() {
            if (!gameActive) return;
            
            // Basic AI: Pick a random empty cell
            const emptyIndices = gameState.map((val, idx) => val === "" ? idx : null).filter(val => val !== null);
            if (emptyIndices.length > 0) {
                const randomIndex = emptyIndices[Math.floor(Math.random() * emptyIndices.length)];
                const cell = document.querySelector(`[data-index="${randomIndex}"]`);
                makeMove(cell, randomIndex);
            }
        }

        function checkResult() {
            let roundWon = false;
            let winningLine = [];

            for (let condition of winningConditions) {
                const [a, b, c] = condition;
                if (gameState[a] && gameState[a] === gameState[b] && gameState[a] === gameState[c]) {
                    roundWon = true;
                    winningLine = condition;
                    break;
                }
            }

            if (roundWon) {
                statusText.innerText = `Player ${currentPlayer} Wins!`;
                highlightWinner(winningLine);
                updateScore(currentPlayer.toLowerCase());
                gameActive = false;
                return;
            }

            if (!gameState.includes("")) {
                statusText.innerText = "It's a Draw!";
                updateScore('draws');
                gameActive = false;
                return;
            }

            // Switch Player
            currentPlayer = currentPlayer === 'X' ? 'O' : 'X';
            statusText.innerText = `Player ${currentPlayer}'s Turn`;
        }

        function highlightWinner(line) {
            line.forEach(index => {
                cells[index].classList.add('winner');
            });
        }

        function updateScore(winner) {
            if (winner === 'x') scores.x++;
            else if (winner === 'o') scores.o++;
            else scores.draws++;

            document.getElementById('score-x').innerText = scores.x;
            document.getElementById('score-o').innerText = scores.o;
            document.getElementById('score-draws').innerText = scores.draws;
        }

        function restartGame() {
            currentPlayer = 'X';
            gameState = ["", "", "", "", "", "", "", "", ""];
            gameActive = true;
            statusText.innerText = "Player X's Turn";
            cells.forEach(cell => {
                cell.innerText = "";
                cell.className = 'cell';
            });
        }

        // --- Event Listeners ---

        cells.forEach(cell => cell.addEventListener('click', handleCellClick));
        
        resetBtn.addEventListener('click', restartGame);

        pvpBtn.addEventListener('click', () => {
            isAiMode = false;
            pvpBtn.classList.add('active');
            pvaBtn.classList.remove('active');
            restartGame();
        });

        pvaBtn.addEventListener('click', () => {
            isAiMode = true;
            pvaBtn.classList.add('active');
            pvpBtn.classList.remove('active');
            restartGame();
        });
    </script>
</body>
</html>
